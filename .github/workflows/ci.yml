name: CI

on:
  push:
  pull_request:
  # Lets the release workflow gate on exactly these checks instead of
  # restating them, so the two cannot drift apart.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Check formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests

      - name: Run tests
        run: swift test

      - name: Build release executable
        run: swift build -c release

      - name: Check distribution dependency baseline
        run: swift scripts/check-distribution-inventory.swift

      - name: Check secret hygiene
        run: swift scripts/check-secret-hygiene.swift

      - name: Check cross-language pinned build profile
        run: swift scripts/check-pinned-build-profile.swift

      - name: Test the personal-memory driver
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Check packaging manifests
        run: |
          bash -n scripts/package-send-helper.sh
          bash -n scripts/check-public-release.sh
          python3 -m py_compile scripts/personal-memory-parallel.py
          bash scripts/check-public-release.sh
          plutil -lint Packaging/GreenBubbles/Info.plist
          plutil -lint Packaging/GreenBubblesInputHelper/Info.plist
          plutil -lint Packaging/GreenBubblesInputHelper/me.greenbubbles.InputHelper.plist
          plutil -lint Packaging/GreenBubbles.entitlements
          plutil -lint Packaging/GreenBubblesInputHelper.entitlements

      - name: Check the release helper contains no diagnostic bypass
        run: |
          # These subcommands drive input and read screen content without a
          # capability, an approval, the outbox, the audit journal, or the XPC
          # peer check. In a binary holding Accessibility and Screen Recording
          # they would be an unauthenticated bypass of the whole architecture.
          swift build -c release --product greenbubbles-input-helper
          # Greps for a usage string that exists only inside the debug block.
          # Checking for subcommand names is unreliable: words like "capture"
          # and "windows" occur in framework strings.
          if strings .build/release/greenbubbles-input-helper |
            grep -q 'focus-probe --profile'; then
            echo "error: the release helper contains the debug diagnostics" >&2
            exit 1
          fi
          echo "release helper contains no diagnostic bypass"

      - name: Check the send path ships closed
        run: |
          # A build with no pinned release verifying key must refuse every
          # release-signed calibration profile, so the send path cannot leave
          # the dry-run stage by default.
          if grep -q 'generatedReleasePublicKeys: \[String\] = \[\]' \
            Sources/GreenBubblesSendKit/SendReleaseTrust.swift; then
            echo "release trust root is empty by default"
          else
            echo "error: a release verifying key is committed to the repository" >&2
            exit 1
          fi

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Audit Rust dependencies
        working-directory: Native/GreenBubbles
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file Cargo.lock

      - name: Reproduce the third-party notice bundle
        working-directory: Native/GreenBubbles
        run: |
          cargo install cargo-about --locked --features cli --version 0.9.2
          cargo about generate --locked --fail \
            -o "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md" about.hbs
          diff -u ../../THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"

      - name: Check Rust formatting
        working-directory: Native/GreenBubbles
        run: cargo fmt --check

      - name: Lint restoration engine
        working-directory: Native/GreenBubbles
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run restoration-engine tests
        working-directory: Native/GreenBubbles
        run: cargo test --locked --all-targets

      - name: Check the cross-language send vectors are current
        working-directory: Native/GreenBubbles
        run: |
          cargo run --locked --quiet --example send_canonical_vectors \
            >/tmp/send-canonical-vectors.json
          diff -u ../../docs/send-canonical-vectors.json /tmp/send-canonical-vectors.json
