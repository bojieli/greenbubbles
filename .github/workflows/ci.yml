name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Check formatting
        run: swift format lint --recursive Package.swift Sources Tests

      - name: Run tests
        run: swift test

      - name: Build release executable
        run: swift build -c release

      - name: Check distribution dependency baseline
        run: swift scripts/check-distribution-inventory.swift

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Check Rust formatting
        working-directory: Native/GreenBubblesRestore
        run: cargo fmt --check

      - name: Lint restoration engine
        working-directory: Native/GreenBubblesRestore
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run restoration-engine tests
        working-directory: Native/GreenBubblesRestore
        run: cargo test --locked --all-targets
