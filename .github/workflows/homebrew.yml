name: Update Homebrew

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag with CLI ZIP and checksums, e.g. v0.3.0"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

# The release workflow has already passed the full CI gate before this job
# runs. The formula is generated from the signed release assets and published
# with the repository admin token, so there is no second staged-branch build.
permissions:
  contents: read

concurrency:
  group: homebrew-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release assets and update formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an exact numeric v-prefixed release tag" >&2
            exit 1
          fi
          python3 scripts/homebrew-release.py \
            --version "${RELEASE_TAG#v}" --repository "$GITHUB_REPOSITORY" --publish
