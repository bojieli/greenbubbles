name: Update Homebrew

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag with CLI ZIP and checksums, e.g. v0.3.0"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: homebrew-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify release assets and update formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an exact numeric v-prefixed release tag" >&2
            exit 1
          fi
          python3 scripts/homebrew-release.py \
            --version "${RELEASE_TAG#v}" --repository "$GITHUB_REPOSITORY" --publish
