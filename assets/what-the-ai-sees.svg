<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" width="1240" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A diagram contrasting what stays on the Mac with what an AI actually receives. The left panel holds the whole corpus: 1,855,548 messages across 6,292 tables, 2.98 gigabytes of encrypted databases, about 59 gigabytes of media, and the WeChat database key, all opened read-only. A policy and audit gate in the middle admits only the conversations, fields, time range and destination the owner approved. The right panel is what the model receives: one bounded result page, only the approved fields, a citation for every message, and a note stating what the page does not cover.">
  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FBFCFE"/>

  <text x="620" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#0F172A">What stays here, and what a model actually receives</text>
  <text x="620" y="76" text-anchor="middle" font-size="17" fill="#64748B">The gap between the two is the whole product.</text>

  <!-- left: the Mac -->
  <rect x="48" y="118" width="404" height="366" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="76" y="154" font-size="18" font-weight="700" fill="#0F172A">On your Mac</text>
  <text x="76" y="178" font-size="13.5" fill="#94A3B8">measured on the author's own corpus</text>

  <text x="76" y="220" font-size="15" fill="#334155">1,855,548 messages</text>
  <text x="76" y="250" font-size="15" fill="#334155">6,292 message tables</text>
  <text x="76" y="280" font-size="15" fill="#334155">2.98 GB of SQLCipher databases</text>
  <text x="76" y="310" font-size="15" fill="#334155">~59 GB of images, voice, video, files</text>
  <text x="76" y="340" font-size="15" fill="#334155">the 32-byte WeChat database key</text>

  <line x1="76" y1="368" x2="424" y2="368" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="76" y="396" font-size="14" fill="#64748B">Opened read-only in bounded statements,</text>
  <text x="76" y="418" font-size="14" fill="#64748B">finalized before output. The query path</text>
  <text x="76" y="440" font-size="14" fill="#64748B">builds no corpus copy or vector index.</text>
  <text x="76" y="466" font-size="14" font-weight="600" fill="#16A34A">The key never enters a prompt.</text>

  <!-- gate -->
  <rect x="512" y="152" width="216" height="298" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
  <text x="620" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#15803D">Policy + audit</text>
  <text x="620" y="212" text-anchor="middle" font-size="13" fill="#4D7C63">owner-written, source-bound</text>

  <text x="620" y="256" text-anchor="middle" font-size="14.5" fill="#334155">which conversations</text>
  <text x="620" y="284" text-anchor="middle" font-size="14.5" fill="#334155">which fields</text>
  <text x="620" y="312" text-anchor="middle" font-size="14.5" fill="#334155">which time range</text>
  <text x="620" y="340" text-anchor="middle" font-size="14.5" fill="#334155">local model or remote</text>

  <line x1="546" y1="364" x2="694" y2="364" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="620" y="392" text-anchor="middle" font-size="13.5" fill="#4D7C63">every decision appended to a</text>
  <text x="620" y="412" text-anchor="middle" font-size="13.5" fill="#4D7C63">hash-chained, body-free log</text>
  <text x="620" y="436" text-anchor="middle" font-size="13.5" font-weight="600" fill="#15803D">unknown request → denied</text>

  <line x1="456" y1="300" x2="506" y2="300" stroke="#16A34A" stroke-width="2.5" marker-end="url(#a-green)"/>
  <line x1="732" y1="300" x2="782" y2="300" stroke="#16A34A" stroke-width="2.5" marker-end="url(#a-green)"/>

  <!-- right: the model -->
  <rect x="788" y="118" width="404" height="366" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="816" y="154" font-size="18" font-weight="700" fill="#0F172A">What the model receives</text>
  <text x="816" y="178" font-size="13.5" fill="#94A3B8">one request, one response, no session</text>

  <text x="816" y="220" font-size="15" fill="#334155">one policy-bounded result page</text>
  <text x="816" y="250" font-size="15" fill="#334155">only the approved fields</text>
  <text x="816" y="280" font-size="15" fill="#334155">a citation for every message</text>
  <text x="816" y="310" font-size="15" fill="#334155">what this page does <tspan font-style="italic">not</tspan> cover</text>
  <text x="816" y="340" font-size="15" fill="#334155">hard caps: 8 MiB, 16 KiB per field</text>

  <line x1="816" y1="368" x2="1164" y2="368" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="816" y="396" font-size="14" fill="#64748B">Message text arrives labelled as untrusted</text>
  <text x="816" y="418" font-size="14" fill="#64748B">data. A sentence inside a chat cannot</text>
  <text x="816" y="440" font-size="14" fill="#64748B">widen the policy that released it.</text>
  <text x="816" y="466" font-size="14" font-weight="600" fill="#16A34A">Incomplete coverage is stated, not hidden.</text>
</svg>
