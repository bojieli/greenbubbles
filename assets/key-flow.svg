<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How GreenBubbles unlocks a WeChat database</title>
  <desc id="desc">Capture obtains the account secret from WeChat during login and stores it in a private local credential file. That secret and the database file's salt derive its encryption key locally. GreenBubbles uses the key to query the original encrypted database read-only. This one-file example repeats for other database files; there is no separate key per table.</desc>
  <rect width="960" height="452" rx="20" fill="#F3F8F4"/>
  <text x="32" y="39" font-size="23" font-weight="700" fill="#12382D">How the key unlocks your WeChat data</text>
  <text x="32" y="65" font-size="15" fill="#46645A">One database file shown. The same process applies to each file in your account.</text>
  <g stroke="#B8CFC2" stroke-width="2" fill="#FFFFFF">
    <rect x="32" y="93" width="260" height="96" rx="14"/>
    <rect x="378" y="93" width="550" height="96" rx="14" fill="#E0EDE3"/>
    <rect x="32" y="260" width="244" height="94" rx="14"/>
    <rect x="356" y="260" width="236" height="94" rx="14" fill="#087F5B" stroke="#087F5B"/>
    <rect x="674" y="260" width="254" height="94" rx="14"/>
  </g>
  <g text-anchor="middle">
    <text x="162" y="128" font-size="18" font-weight="700" fill="#12382D">WeChat at login</text>
    <text x="162" y="157" font-size="15" fill="#46645A">32-byte account secret in memory</text>
    <text x="653" y="125" font-size="18" font-weight="700" fill="#12382D">Private local credential file</text>
    <text x="653" y="151" font-size="15" fill="#46645A">Stores the account key (master secret)</text>
    <text x="653" y="174" font-size="13" fill="#46645A">Owner-only permissions · plaintext secret · query profile holds its path</text>
    <text x="335" y="120" font-size="12" fill="#46645A">Capture</text>
    <text x="154" y="297" font-size="18" font-weight="700" fill="#12382D">Database file’s salt</text>
    <text x="154" y="325" font-size="14" fill="#46645A">Read from its file header</text>
    <text x="474" y="296" font-size="18" font-weight="700" fill="#FFFFFF">Derive its key locally</text>
    <text x="474" y="325" font-size="14" fill="#FFFFFF">Account secret + file’s salt</text>
    <text x="801" y="295" font-size="18" font-weight="700" fill="#12382D">WeChat database file</text>
    <text x="801" y="325" font-size="14" fill="#46645A">Original encrypted file · many tables</text>
    <text x="633" y="287" font-size="12" fill="#46645A">Unlock</text>
  </g>
  <g fill="none" stroke="#087F5B" stroke-width="2.5">
    <path d="M297 141h70"/><path d="M474 194v55"/>
    <path d="M281 307h64"/><path d="M597 307h66"/>
  </g>
  <g fill="#087F5B"><polygon points="367,141 356,135 356,147"/><polygon points="474,249 468,238 480,238"/><polygon points="345,307 334,301 334,313"/><polygon points="663,307 652,301 652,313"/></g>
  <text x="32" y="395" font-size="16" font-weight="700" fill="#12382D">Read-only query → selected messages → your agent</text>
  <text x="32" y="424" font-size="14" fill="#46645A">Key material stays local. The derived key covers the file, not an individual table.</text>
</svg>
