<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Live access to the original WeChat databases</title>
  <desc id="desc">GreenBubbles uses a private local credential to query WeChat's original encrypted database files read-only. Selected message pages go to the app or agent. Ordinary live queries do not maintain an exported chat database. Optional backups and prepared corpora are separate point-in-time copies.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9Z" fill="#087F5B"/></marker></defs>
  <rect width="960" height="390" rx="20" fill="#F3F8F4"/>
  <text x="32" y="40" font-size="23" font-weight="700" fill="#12382D">Live access. Original data.</text>
  <text x="32" y="67" font-size="15" fill="#46645A">No exported chat database to maintain or synchronize for ordinary queries.</text>
  <g stroke="#B8CFC2" stroke-width="2" fill="#FFFFFF">
    <rect x="32" y="111" width="252" height="120" rx="16"/>
    <rect x="365" y="111" width="230" height="120" rx="16" fill="#087F5B" stroke="#087F5B"/>
    <rect x="676" y="111" width="252" height="120" rx="16"/>
  </g>
  <g text-anchor="middle">
    <text x="158" y="149" font-size="19" font-weight="700" fill="#12382D">WeChat’s original files</text>
    <text x="158" y="178" font-size="15" fill="#46645A">Encrypted SQLite databases</text>
    <text x="158" y="204" font-size="14" fill="#46645A">Updated locally by WeChat</text>
    <text x="480" y="150" font-size="22" font-weight="700" fill="#FFFFFF">GreenBubbles</text>
    <text x="480" y="179" font-size="15" fill="#FFFFFF">Unlock and query locally</text>
    <text x="480" y="204" font-size="14" fill="#FFFFFF">Read-only · bounded results</text>
    <text x="802" y="150" font-size="19" font-weight="700" fill="#12382D">Your app or agent</text>
    <text x="802" y="179" font-size="15" fill="#46645A">Selected message pages</text>
    <text x="802" y="204" font-size="14" fill="#46645A">Cloud agents send to their model</text>
  </g>
  <g stroke="#087F5B" stroke-width="2.5"><path d="M289 171h65"/><path d="M600 171h65"/><path d="M480 282v-41"/></g>
  <rect x="365" y="286" width="230" height="47" rx="12" fill="#E0EDE3"/>
  <text x="480" y="315" text-anchor="middle" font-size="15" fill="#12382D">Private local account key</text>
  <text x="32" y="359" font-size="14" fill="#46645A">Optional backups and memory corpora are separate point-in-time copies; refresh them explicitly.</text>
  <g fill="#087F5B"><polygon points="354,171 343,165 343,177"/><polygon points="665,171 654,165 654,177"/><polygon points="480,241 474,252 486,252"/></g>
</svg>
