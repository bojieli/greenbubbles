<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="WeChat's encrypted databases sit on your Mac. GreenBubbles, a command-line tool and Mac app, reads them read-only and passes on only the chats you pick to your AI tool. It can also write an encrypted backup that opens without WeChat.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="336" fill="#FBFCFE"/>

  <rect x="40" y="56" width="210" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="145" y="105" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">WeChat's databases</text>
  <text x="145" y="133" text-anchor="middle" font-size="14" fill="#64748B">encrypted, on your Mac</text>

  <text x="300" y="101" text-anchor="middle" font-size="12.5" fill="#64748B">read-only</text>
  <line x1="254" y1="116" x2="346" y2="116" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="350" y="46" width="230" height="130" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
  <text x="465" y="103" text-anchor="middle" font-size="20" font-weight="700" fill="#15803D">greenbubbles</text>
  <text x="465" y="131" text-anchor="middle" font-size="14.5" fill="#334155">CLI + Mac app</text>

  <line x1="584" y1="116" x2="676" y2="116" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="680" y="56" width="180" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="770" y="105" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">your AI tool</text>
  <text x="770" y="132" text-anchor="middle" font-size="13.5" fill="#64748B">only the chats you pick</text>

  <text x="490" y="211" font-size="12.5" fill="#64748B">backup</text>
  <line x1="465" y1="180" x2="465" y2="234" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="350" y="238" width="230" height="72" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="465" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">encrypted backup</text>
  <text x="465" y="291" text-anchor="middle" font-size="14" fill="#64748B">opens without WeChat</text>
</svg>
