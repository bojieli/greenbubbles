[package]
name = "greenbubbles-restore"
version = "0.1.0"
edition = "2021"
default-run = "greenbubbles-restore"
license = "Proprietary"
publish = false

[dependencies]
argon2 = "0.5"
base64 = "0.22"
bip39 = { version = "2.2", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
md5 = "0.7"
prost = "0.13"
rusqlite = { version = "0.40", features = ["backup", "bundled-sqlcipher", "hooks"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
walkdir = "2"
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
wx-db = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
wx-context = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
wx-decrypt = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
wx-media = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74", features = ["audio"] }

[dev-dependencies]
filetime = "0.2"
